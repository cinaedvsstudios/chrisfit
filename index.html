<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChrisFit (Web)</title>
    <!--
      ChrisFit Web Clone

      This HTML file serves as the entry point for the ChrisFit web application.  It
      references a handful of CSS files that mirror the Android app’s colour
      palette and layout and pulls in a small JavaScript bundle built from
      vanilla ES modules.  See docs/README.md for a description of each
      stylesheet and script.

      The page intentionally avoids any framework-specific structure to make
      maintenance straightforward.  All dynamic behaviour lives in the
      JavaScript modules under js/.
    -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/history.css" />
    <link rel="stylesheet" href="css/dialogs.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Main application container.  The contents of this element are
         manipulated by js/app.js at runtime to show the current screen. -->
    <div id="app"></div>

    <!-- Configuration example – copy this file to js/config.js and fill in
         your own Apps Script URL and optional bearer token.  Never commit
         credentials to version control. -->
    <script type="module" src="js/config.example.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
